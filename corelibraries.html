<script>
    document.querySelectorAll(".lang-button").forEach(button => {
      button.addEventListener("click", event => {
        const requested = button.dataset.lang;
        const target = requested === "pt-BR" ? "corelibraries.pt-BR.html" : "corelibraries.html";
        const current = "corelibraries.html";
        if (target === current) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        localStorage.setItem("linuxtoys-dev-lang", requested);
        location.href = target + location.search + location.hash;
      }, true);
    });
  </script>
